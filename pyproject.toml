[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "flowide"
version = "0.1.0"
description = "Local Flow IDE substrate: exact-rational fuel gating, 3200-node roadmap decomposition, and a zero-dependency dashboard."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hamboning Media LLC" }]
keywords = ["flow", "ide", "rational", "dashboard", "local-first"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
# Deliberately empty: the substrate is stdlib-only.
dependencies = []

[project.scripts]
flow = "flowide.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
